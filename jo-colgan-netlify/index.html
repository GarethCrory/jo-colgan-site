<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jo Colgan | Professional Pianist – Weddings, Events &amp; Hotel Lounges</title>
<meta name="description" content="Jo Colgan is a pianist offering beautiful live piano music for weddings, private events and hotel lounges across Ireland.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="loading">

<header class="site">
  <div class="wrap nav">
    <button class="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <ul class="menu">
      <li><a href="#music">Music</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a class="logo" href="#top"><b data-c="siteTitle">Jo Colgan</b><span data-c="siteSubtitle">Pianist</span></a>
    <div class="social">
      <a data-href="contact.instagram" href="https://www.instagram.com/jo.colgan/" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor"/></svg></a>
      <a data-href="contact.facebook" href="https://www.facebook.com/JoColgan" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.5-1.3 1.4-1.3H17V2.3h-2.5C11.8 2.3 10.6 4 10.6 6.4v2.1H8V12h2.6v9.7H14V12h2.7l.4-3.5z"/></svg></a>
    </div>
  </div>
</header>

<main id="top">

<section class="hero" id="hero">
  <div class="wrap">
    <p class="eyebrow" data-c="hero.eyebrow"></p>
    <h1 data-c="hero.heading"></h1>
    <p class="sub" data-c="hero.subheading"></p>
    <p class="tags" data-c="hero.tags"></p>
    <div class="ctas">
      <a class="btn btn-solid" href="#music" data-c="hero.primaryButton"></a>
      <a class="btn btn-ghost" href="#contact" data-c="hero.secondaryButton"></a>
    </div>
  </div>
</section>

<section class="services" id="weddings">
  <div class="wrap">
    <h2 data-c="services.heading"></h2>
    <div class="grid4" id="services"></div>
  </div>
</section>

<section class="about" id="about">
  <div class="wrap">
    <img class="about-img" id="about-img" alt="Jo Colgan at the piano" loading="lazy">
    <div class="left">
      <h2 data-c="about.heading"></h2>
      <div id="about-text"></div>
      <blockquote id="about-quote"></blockquote>
      <a class="btn btn-solid" href="#contact" data-c="about.buttonText"></a>
    </div>
  </div>
</section>

<section class="music" id="music">
  <div class="wrap">
    <h2 data-c="music.heading"></h2>
    <p class="eyebrow" data-c="music.eyebrow"></p>
    <div class="tracks" id="tracks"></div>
    <button class="btn btn-line" id="rep-btn" aria-expanded="false" aria-controls="repertoire" data-c="music.repertoireButton"></button>
    <ol class="rep" id="repertoire" hidden></ol>
  </div>
</section>

<section class="testimonials" id="testimonials">
  <div class="wrap">
    <h2 data-c="testimonials.heading"></h2>
    <div class="quotes" id="quotes"></div>
  </div>
</section>

<section class="band" id="band">
  <h2 data-c="band.heading"></h2>
  <p data-c="band.text"></p>
  <a class="btn btn-solid" href="#contact" data-c="band.buttonText"></a>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <div class="left">
      <h2 data-c="contact.heading"></h2>
      <p data-c="contact.intro"></p>
      <p>Phone: <a id="phone-link" href="tel:+447872953224" data-c="contact.phone">07872 953224</a></p>
      <p>Or message Jo on <a data-href="contact.facebook" href="https://www.facebook.com/JoColgan" target="_blank" rel="noopener">Facebook</a> or <a data-href="contact.instagram" href="https://www.instagram.com/jo.colgan/" target="_blank" rel="noopener">Instagram</a>.</p>
    </div>
    <!-- Netlify Forms: this form must stay in the HTML so Netlify can detect it -->
    <form name="enquiry" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="enquiry">
      <p class="hidden"><label>Leave blank <input name="bot-field"></label></p>
      <div><label for="name">Your name</label><input id="name" name="name" required autocomplete="name"></div>
      <div><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email"></div>
      <div><label for="phone">Phone</label><input id="phone" type="tel" name="phone" autocomplete="tel"></div>
      <div><label for="date">Event date</label><input id="date" type="date" name="date"></div>
      <div class="full"><label for="type">Type of event</label>
        <select id="type" name="event-type"><option>Wedding</option><option>Hotel / venue event</option><option>Corporate event</option><option>Private function</option><option>Other</option></select></div>
      <div class="full"><label for="venue">Venue</label><input id="venue" name="venue"></div>
      <div class="full"><label for="msg">Message</label><textarea id="msg" name="message" placeholder="Tell Jo a little about your day and any music you'd love…"></textarea></div>
      <div class="full"><button class="btn btn-solid" type="submit" data-c="contact.formButton">Send enquiry →</button></div>
    </form>
  </div>
</section>

</main>

<footer>
  <div class="wrap foot">
    <div>
      <a class="logo" href="#top"><b data-c="siteTitle">Jo Colgan</b><span data-c="siteSubtitle">Pianist</span></a>
      <p data-c="footer.tagline"></p>
    </div>
    <div>
      <h4>Menu</h4>
      <ul><li><a href="#music">Music</a></li><li><a href="#about">About</a></li><li><a href="#contact">Contact</a></li></ul>
    </div>
    <div>
      <h4>Follow Jo</h4>
      <ul>
        <li><a data-href="contact.instagram" href="https://www.instagram.com/jo.colgan/" target="_blank" rel="noopener">Instagram</a></li>
        <li><a data-href="contact.facebook" href="https://www.facebook.com/JoColgan" target="_blank" rel="noopener">Facebook</a></li>
        <li><a id="phone-link-2" href="tel:+447872953224" data-c="contact.phone">07872 953224</a></li>
      </ul>
    </div>
  </div>
  <p class="copy">© <span id="yr">2026</span> <span data-c="siteTitle">Jo Colgan</span> · <span data-c="siteSubtitle">Pianist</span></p>
</footer>

<script src="/app.js"></script>
</body>
</html>

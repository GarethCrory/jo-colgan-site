<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Jo Colgan Pianist</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:16px}
h1{font-size:44px;margin:0 0 10px}
p{color:var(--muted);margin:0 0 30px}
.s{font-style:italic;font-size:30px;color:var(--accent);margin-bottom:20px}
</style>
</head>
<body>
<div>
  <div class="s">Thank you</div>
  <h1 id="h">Your enquiry has been sent</h1>
  <p id="t">Jo will be in touch with you shortly.</p>
  <a class="btn btn-solid" href="/">Back to the website →</a>
</div>
<script>
fetch('/content/site.json',{cache:'no-cache'}).then(r=>r.json()).then(c=>{
  const t=c.theme||{},m={background:'--bg',text:'--ink',mutedText:'--muted',accent:'--accent',accentDark:'--accent-dark'};
  for(const k in m) if(t[k]) document.documentElement.style.setProperty(m[k],t[k]);
  if(c.contact?.thankYouHeading) document.getElementById('h').textContent=c.contact.thankYouHeading;
  if(c.contact?.thankYouText) document.getElementById('t').textContent=c.contact.thankYouText;
}).catch(()=>{});
</script>
</body>
</html>
